# =============================================================================
# NovaCart Pipeline -- pyproject.toml
# Tool configuration for ruff (lint + format) and mypy (type checking).
# =============================================================================

# -----------------------------------------------------------------------------
# Ruff -- linter and formatter
# Replaces: flake8, isort, pyupgrade, pep8-naming in a single pass.
# Docs: https://docs.astral.sh/ruff/
# -----------------------------------------------------------------------------

[tool.ruff]
# Minimum Python version to target for syntax rules.
target-version = "py311"

# Line length matching Black's default; adjust if your team prefers narrower.
line-length = 100

[tool.ruff.lint]
# Rule sets enabled:
#   E / W  -- pycodestyle errors and warnings
#   F      -- pyflakes (undefined names, unused imports, etc.)
#   I      -- isort (import ordering)
#   UP     -- pyupgrade (modernise syntax for target-version)
#   B      -- flake8-bugbear (likely bugs and design issues)
#   N      -- pep8-naming conventions
select = ["E", "W", "F", "I", "UP", "B", "N"]

# Ignored rules:
#   E501   -- line-too-long: handled by the formatter, not the linter
#   B008   -- do-not-perform-function-call-in-default-argument: too noisy for Pydantic validators
ignore = ["E501", "B008"]

# Allow ruff to auto-fix all fixable violations (safe subset only).
fixable = ["ALL"]

[tool.ruff.lint.isort]
# Group first-party imports under the src package.
known-first-party = ["src"]

[tool.ruff.format]
# Use double quotes to match the existing codebase style.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false


# -----------------------------------------------------------------------------
# Mypy -- static type checker
# Docs: https://mypy.readthedocs.io/
# -----------------------------------------------------------------------------

[tool.mypy]
# Require explicit return types and annotations on all public functions.
strict = false

# Minimum settings that catch real bugs without requiring full strict mode:
warn_return_any         = true
warn_unused_configs     = true
warn_unused_ignores     = true
warn_redundant_casts    = true
check_untyped_defs      = true
no_implicit_optional    = true
disallow_untyped_defs   = false   # relax: not all functions are annotated yet

# Treat src/ as the first-party package root.
mypy_path = "."

# pandas-stubs provides type information for pandas; without this mypy
# would treat every pd.DataFrame attribute as Any.
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

# pyarrow does not ship complete stubs; suppress the missing-import noise.
[[tool.mypy.overrides]]
module = "pyarrow.*"
ignore_missing_imports = true

# yaml (pyyaml) does not ship inline stubs.
[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
