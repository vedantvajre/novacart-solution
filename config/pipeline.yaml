# NovaCart Pipeline Configuration
pipeline:
  name: novacart-etl

paths:
  landing_orders:   data/landing/orders
  landing_customers: data/landing/customers
  landing_products_db: data/landing/products.db
  bronze: data/bronze
  silver: data/silver
  gold:   data/gold
  quarantine: data/quarantine
  logs:   logs
  state:  state

silver:
  min_order_amount: 0.0
  max_order_amount: 100000.0

gold:
  scd2_track_fields:
    - city
    - country
    - email

notify:
  slack_channel: "#novacart-pipeline"   # replace with your channel ID, e.g. C0123ABCDEF
  watsonx_model_id: "ibm/granite-13b-instruct-v2"
  watsonx_project_id: ""                # set here or via WATSONX_PROJECT_ID env var
